<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Quiz DFC - Professor Moreira</title><style>
:root{font-family:Arial,Helvetica,sans-serif;color:#17213c}*{box-sizing:border-box}body{margin:0;background:linear-gradient(125deg,#ffdf36,#ff7b27 30%,#e52b87 60%,#5335cf 85%,#0ab4d9);min-height:100dvh;padding:12px}.app{max-width:850px;margin:auto;background:#fff;border:5px solid #ffd529;border-radius:23px;overflow:hidden;box-shadow:0 12px 40px #160d5470}.head{background:linear-gradient(95deg,#5027c7,#ed2887,#ff9c1a);color:white;text-align:center;padding:17px 12px}.head h1{font-size:clamp(20px,5vw,31px);margin:0;font-weight:900}.head p{margin:7px 0 0;font-size:17px;font-weight:bold}.content{padding:18px 17px 12px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:17px;font-weight:bold}.pill{background:#f1eaff;border-radius:30px;padding:9px 12px}.bar{height:13px;background:#e9e7f3;border-radius:20px;margin:13px 0 20px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#08bcd5,#38bb4d);transition:width .3s}.qtitle{color:#5d22bf;font-size:clamp(22px,5.5vw,29px);font-weight:900;margin-bottom:14px}.question{font-size:clamp(19px,4.5vw,23px);line-height:1.48;white-space:pre-line;font-weight:600}.question table{font-size:17px}.options{display:grid;gap:10px;margin:19px 0}.option{border:3px solid #d8d6eb;border-radius:15px;background:#f9f8ff;color:#17213c;padding:13px;text-align:left;font-size:clamp(18px,4.3vw,22px);font-weight:700;line-height:1.4;cursor:pointer}.option.selected{border-color:#6533cc;background:#eee6ff}.option.correct{border-color:#078d37;background:#c8ffd5;box-shadow:0 0 18px #00df58;animation:pulseGreen .65s 2}.option.wrong{border-color:#d90020;background:#ffccd1;box-shadow:0 0 18px #f00037;animation:pulseRed .65s 2}@keyframes pulseGreen{50%{box-shadow:0 0 32px #00ed65;background:#8bffae}}@keyframes pulseRed{50%{box-shadow:0 0 32px #ff183e;background:#ff9da9}}button{font-family:inherit}.confirm{width:100%;border:0;border-radius:13px;background:linear-gradient(90deg,#5727c9,#c82ac4);color:white;padding:15px;font-size:20px;font-weight:900;cursor:pointer}.confirm:disabled{background:#a5a2b5;cursor:not-allowed}.feedback{margin-top:17px;border-radius:16px;padding:15px;font-size:19px;line-height:1.55}.feedback.good{background:#e7ffed;border:3px solid #0f9c42}.feedback.bad{background:#fff0f0;border:3px solid #e22336}.feedback h3{font-size:23px;margin:0 0 8px}.feedback p{margin:8px 0}.feedback ul{padding-left:23px}.feedback li{margin:7px 0}.calc{font-weight:900;background:#fff;border-radius:9px;padding:10px;margin:9px 0}.nav{display:flex;gap:9px;padding:14px 17px 19px;background:#f3f0ff}.nav button{flex:1;min-width:0;border:0;border-radius:13px;padding:13px 5px;font-size:clamp(14px,3.5vw,19px);font-weight:900;color:white;background:#5c35c6;cursor:pointer}.nav button:last-child{background:#e74655}.nav button:disabled{opacity:.45}.end{padding:28px 18px;text-align:center}.end h2{font-size:30px;color:#5a2ac7}.score{font-size:32px;font-weight:900;color:#078d37}.small{font-size:16px;color:#555}.hide{display:none!important}table{border-collapse:collapse;width:100%;margin:12px 0}th,td{border:1px solid #aaa;padding:8px;text-align:left}th{background:#eae5ff}@media(min-width:700px){body{padding:30px}.content{padding:25px 30px}.nav{padding:18px 30px 24px}}

.cover{min-height:75dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:35px 20px;background:radial-gradient(circle at top left,#ffe44c,transparent 40%),linear-gradient(145deg,#6928cf,#e62a91 58%,#ff8e22);color:white}.cover h1{font-size:clamp(27px,7vw,48px);line-height:1.15;text-shadow:2px 3px 0 #43157a;margin:12px 0 30px}.cover h2{font-size:clamp(38px,11vw,72px);margin:0 0 18px;color:#fff047;text-shadow:3px 4px 0 #642096}.cover h3{font-size:clamp(23px,6vw,37px);line-height:1.2;margin:0 0 30px}.cover button{font-size:clamp(22px,5vw,30px);font-weight:900;padding:17px 35px;border:4px solid #fff;border-radius:20px;background:#ffdc24;color:#4d168d;box-shadow:0 8px 0 #a44d08;cursor:pointer}.cover .hint{font-size:18px;font-weight:bold;margin-top:30px}.hide{display:none!important}
</style></head><body><main class="app"><section id="cover" class="cover"><div style="font-size:50px">🎡 📚 🏆</div><h1>CURSO DE CONTABILIDADE<br>PROFESSOR MOREIRA</h1><h2>DFC - FGV</h2><h3>Exame de Suficiência do CFC</h3><button id="startQuiz">▶ COMEÇAR QUIZ</button><p class="hint">10 questões • Resoluções comentadas • Modo Aluno</p></section><header class="head hide"><h1>CURSO DE CONTABILIDADE<br>PROFESSOR MOREIRA</h1><p>🎡 DESAFIO DFC • CPC 03 (R2)</p><p>Operacional • Investimento • Financiamento</p></header><section id="quiz" class="hide"><div class="content"><div class="top"><span id="counter" class="pill"></span><span id="score" class="pill"></span></div><div class="bar"><div id="progress" class="fill"></div></div><div id="qtitle" class="qtitle"></div><div id="question" class="question"></div><div id="options" class="options"></div><button id="confirm" class="confirm">CONFIRMAR RESPOSTA</button><div id="feedback" class="feedback hide" aria-live="polite"></div></div><nav class="nav"><button id="prev">⬅ VOLTAR</button><button id="next">SEGUIR ➡</button><button id="restart">↻ REINICIAR</button></nav></section><section id="end" class="end hide"></section></main><script>
const Q=[
{t:'Empresa comercial',q:`Uma sociedade empresária que comercializa eletrodomésticos apresentou, em setembro de 2024, as seguintes movimentações de caixa:\n\n• Recebimento de clientes pela venda de mercadorias: R$ 280.000.\n• Pagamento a fornecedores de mercadorias: R$ 110.000.\n• Pagamento de salários dos empregados: R$ 40.000.\n• Recebimento pela venda de um veículo utilizado na administração: R$ 35.000.\n\nNa Demonstração dos Fluxos de Caixa, o fluxo líquido das atividades operacionais e o fluxo das atividades de investimento são, respectivamente:`,a:['R$ 165.000 e R$ 0.','R$ 130.000 e R$ 35.000.','R$ 280.000 e R$ 35.000.','R$ 170.000 e R$ 35.000.','R$ 130.000 e R$ 0.'],c:1,r:`<p><b>1. Atividade operacional:</b> os recebimentos de clientes entram com sinal positivo; pagamentos a fornecedores e salários são saídas.</p><div class="calc">R$ 280.000 − R$ 110.000 − R$ 40.000 = R$ 130.000</div><p><b>2. Atividade de investimento:</b> a venda do veículo utilizado na administração gera entrada de R$ 35.000, porque o veículo era um bem do imobilizado, e não mercadoria.</p><p><b>Armadilha FGV:</b> nem toda venda de veículo é operacional. A classificação depende de sua finalidade na entidade.</p>`},
{t:'Aquisição de imobilizado',q:`Uma indústria de móveis realizou as seguintes operações, todas com movimentação de caixa:\n\n• Recebimento pela venda de móveis: R$ 500.000.\n• Aquisição de máquinas para utilização na produção: R$ 180.000.\n• Pagamento de despesas administrativas: R$ 60.000.\n• Obtenção de empréstimo bancário: R$ 120.000.\n\nConsiderando o CPC 03 (R2), a aquisição das máquinas e a obtenção do empréstimo são classificadas, respectivamente, como atividades:`,a:['Operacional e operacional.','De investimento e operacional.','De investimento e de financiamento.','De financiamento e de investimento.','Operacional e de financiamento.'],c:2,r:`<p><b>Máquinas:</b> desembolso de R$ 180.000 para adquirir ativos de longo prazo destinados à produção. É <b>investimento</b>.</p><p><b>Empréstimo:</b> entrada de R$ 120.000 de recursos obtidos junto ao banco. É <b>financiamento</b>.</p><p>Os R$ 500.000 recebidos pelas vendas e os R$ 60.000 de despesas administrativas são operacionais, mas não foram solicitados na pergunta.</p><p><b>Armadilha FGV:</b> embora a máquina participe da operação produtiva, sua aquisição é fluxo de investimento.</p>`},
{t:'Instituição financeira',q:`Um banco comercial recebeu, durante determinado período:\n\n• R$ 600.000 referentes à liquidação de empréstimos anteriormente concedidos a clientes.\n• R$ 90.000 de juros sobre empréstimos concedidos.\n• R$ 150.000 pela emissão de novas ações.\n\nConsiderando a natureza das atividades de uma instituição financeira, os recebimentos de R$ 600.000 e R$ 90.000 devem ser classificados como:`,a:['Atividades de investimento.','Atividades operacionais.','Atividades de financiamento.','Atividade operacional e atividade de investimento, respectivamente.','Atividade de investimento e atividade de financiamento, respectivamente.'],c:1,r:`<p>O negócio principal de um banco inclui conceder empréstimos e receber os valores emprestados e seus juros.</p><p><b>R$ 600.000:</b> recebimento do principal de empréstimos concedidos a clientes → <b>operacional</b>.</p><p><b>R$ 90.000:</b> juros de empréstimos concedidos pelo banco → <b>operacional</b>.</p><p><b>R$ 150.000:</b> emissão de ações → <b>financiamento</b>, pois altera o capital próprio.</p><p><b>Armadilha FGV:</b> empréstimos concedidos por uma entidade não financeira são normalmente investimento; para um banco, integram sua atividade operacional.</p>`},
{t:'Integralização de capital',q:`Uma sociedade empresária apresentou as seguintes entradas de caixa:\n\n• Recebimento de clientes: R$ 320.000.\n• Integralização de capital social pelos sócios, em dinheiro: R$ 200.000.\n• Recebimento pela venda de equipamentos utilizados na administração: R$ 50.000.\n\nOs valores classificados como fluxos de caixa de atividades operacionais, de investimento e de financiamento são, respectivamente:`,a:['R$ 320.000, R$ 50.000 e R$ 200.000.','R$ 320.000, R$ 200.000 e R$ 50.000.','R$ 370.000, R$ 0 e R$ 200.000.','R$ 520.000, R$ 50.000 e R$ 0.','R$ 320.000, R$ 0 e R$ 250.000.'],c:0,r:`<p><b>Operacional:</b> R$ 320.000 recebidos de clientes pela atividade principal.</p><p><b>Investimento:</b> R$ 50.000 recebidos pela alienação de equipamentos usados na administração.</p><p><b>Financiamento:</b> R$ 200.000 recebidos dos sócios para integralizar capital.</p><p><b>Armadilha FGV:</b> capital integralizado não é receita de venda nem lucro. É aporte de proprietários e aparece no fluxo de financiamento.</p>`},
{t:'Pagamento de empréstimos',q:`Uma empresa realizou, em outubro de 2024, os seguintes pagamentos em dinheiro:\n\n• Fornecedores de mercadorias: R$ 80.000.\n• Salários dos empregados: R$ 45.000.\n• Amortização do principal de empréstimo bancário: R$ 100.000.\n• Aquisição de terreno para construção de uma nova fábrica: R$ 150.000.\n\nNa Demonstração dos Fluxos de Caixa, os pagamentos classificados como atividades operacionais, de investimento e de financiamento totalizam, respectivamente:`,a:['R$ 125.000, R$ 150.000 e R$ 100.000.','R$ 225.000, R$ 150.000 e R$ 0.','R$ 125.000, R$ 100.000 e R$ 150.000.','R$ 80.000, R$ 195.000 e R$ 100.000.','R$ 375.000, R$ 0 e R$ 0.'],c:0,r:`<p><b>Operacionais:</b> fornecedores (R$ 80.000) e salários (R$ 45.000).</p><div class="calc">R$ 80.000 + R$ 45.000 = R$ 125.000</div><p><b>Investimento:</b> terreno para construir fábrica = R$ 150.000.</p><p><b>Financiamento:</b> amortização do <i>principal</i> do empréstimo = R$ 100.000.</p><p>Como a questão pede os valores dos <b>pagamentos</b>, eles são apresentados em módulo; na apuração do fluxo líquido seriam saídas com sinal negativo.</p><p><b>Armadilha FGV:</b> não confundir amortização do principal com pagamento de juros, cuja classificação obedece às regras aplicáveis do CPC 03.</p>`},
{t:'Compra e venda de investimentos',q:`Uma sociedade empresária, cuja atividade principal é a fabricação de alimentos, realizou as seguintes operações:\n\n• Pagamento de R$ 120.000 pela aquisição de participação societária em outra empresa, sem obtenção de controle.\n• Recebimento de R$ 75.000 pela venda de uma máquina utilizada na produção.\n• Recebimento de R$ 400.000 pela venda de produtos alimentícios.\n\nConsidere que a participação societária não é mantida para negociação nem constitui equivalente de caixa.\n\nAs duas primeiras operações são classificadas na DFC como:`,a:['Atividades operacionais.','Atividades de financiamento.','Atividade de investimento e atividade operacional, respectivamente.','Atividades de investimento.','Atividade de financiamento e atividade de investimento, respectivamente.'],c:3,r:`<p><b>Participação societária:</b> saída de R$ 120.000 para adquirir instrumento patrimonial de outra empresa, não mantido para negociação → <b>investimento</b>.</p><p><b>Venda da máquina:</b> entrada de R$ 75.000 pela alienação de imobilizado → <b>investimento</b>.</p><div class="calc">Fluxo líquido dessas operações: R$ 75.000 − R$ 120.000 = −R$ 45.000</div><p>Os R$ 400.000 da venda de alimentos são operacionais.</p><p><b>Armadilha FGV:</b> a venda de máquina utilizada na produção não é venda de mercadoria da indústria.</p>`},
{t:'Fluxo líquido das três atividades',q:`Uma empresa apresentou as seguintes movimentações de caixa no exercício:\n\n• Recebimento de clientes: R$ 450.000.\n• Pagamento a fornecedores: R$ 180.000.\n• Pagamento de salários: R$ 70.000.\n• Compra de equipamentos à vista: R$ 100.000.\n• Empréstimo bancário recebido: R$ 150.000.\n• Amortização do principal de empréstimos: R$ 50.000.\n\nOs fluxos líquidos das atividades operacionais, de investimento e de financiamento são, respectivamente:`,a:['R$ 200.000, R$ (100.000) e R$ 100.000.','R$ 270.000, R$ (100.000) e R$ 100.000.','R$ 200.000, R$ 100.000 e R$ 100.000.','R$ 450.000, R$ (350.000) e R$ 150.000.','R$ 200.000, R$ (150.000) e R$ 150.000.'],c:0,r:`<p><b>1. Operacional:</b> clientes menos fornecedores e salários.</p><div class="calc">450.000 − 180.000 − 70.000 = +R$ 200.000</div><p><b>2. Investimento:</b> compra à vista de equipamentos.</p><div class="calc">−R$ 100.000</div><p><b>3. Financiamento:</b> empréstimo recebido menos principal amortizado.</p><div class="calc">150.000 − 50.000 = +R$ 100.000</div><p><b>Variação total:</b> 200.000 − 100.000 + 100.000 = +R$ 200.000.</p><p><b>Armadilha FGV:</b> fluxo líquido é entrada menos saída, não apenas a soma dos recebimentos.</p>`},
{t:'Operação sem movimentação de caixa',q:`Uma sociedade empresária adquiriu um equipamento industrial por R$ 240.000, mediante financiamento integral diretamente com o fornecedor, sem qualquer pagamento de entrada no período.\n\nNo mesmo mês, recebeu R$ 90.000 pela venda de mercadorias e pagou R$ 35.000 de salários.\n\nNa Demonstração dos Fluxos de Caixa do período, a aquisição do equipamento:`,a:['Deve ser reconhecida como saída de R$ 240.000 nas atividades de investimento.','Deve ser reconhecida como entrada de R$ 240.000 nas atividades de financiamento.','Deve ser reconhecida como saída operacional de R$ 240.000.','Deve ser reconhecida simultaneamente como entrada de financiamento e saída de investimento de R$ 240.000.','Não deve integrar os fluxos de caixa do período, por não envolver caixa ou equivalentes de caixa.'],c:4,r:`<p>O equipamento foi adquirido com financiamento integral do fornecedor, <b>sem saída de caixa</b> no período.</p><p>O <b>item 43 do CPC 03 (R2)</b> determina que transações de investimento e financiamento que não envolvam caixa sejam excluídas da DFC e divulgadas em outra parte das demonstrações contábeis.</p><p>As outras operações geraram fluxo operacional:</p><div class="calc">R$ 90.000 − R$ 35.000 = +R$ 55.000</div><p><b>Armadilha FGV:</b> adquirir um imobilizado não significa automaticamente registrar uma saída na DFC. Sem desembolso, não há fluxo de caixa.</p>`},
{t:'Construtora e imóveis',q:`Uma construtora atua na construção e venda de apartamentos. Em determinado mês, realizou as seguintes operações à vista:\n\n• Recebimento de R$ 800.000 pela venda de apartamentos construídos para comercialização.\n• Pagamento de R$ 300.000 pela aquisição de terrenos destinados à construção de imóveis para venda.\n• Recebimento de R$ 200.000 pela venda de um imóvel utilizado como sede administrativa.\n\nNa Demonstração dos Fluxos de Caixa, os valores de R$ 800.000, R$ 300.000 e R$ 200.000 são classificados, respectivamente, como atividades:`,a:['Operacional, de investimento e de investimento.','De investimento, de investimento e operacional.','Operacional, operacional e de investimento.','De investimento, operacional e de financiamento.','Operacional, de financiamento e de investimento.'],c:2,r:`<p><b>Venda dos apartamentos:</b> +R$ 800.000 operacional, porque os imóveis são produtos da construtora.</p><p><b>Compra dos terrenos para construir e vender:</b> −R$ 300.000 operacional, porque serão utilizados na formação de estoques.</p><p><b>Venda da sede administrativa:</b> +R$ 200.000 investimento, pois o imóvel era usado pela empresa, não mantido como mercadoria.</p><div class="calc">Fluxo operacional dessas operações: 800.000 − 300.000 = +R$ 500.000</div><p><b>Armadilha FGV:</b> o mesmo tipo de ativo (imóvel) pode gerar classificação diferente conforme sua finalidade.</p>`},
{t:'Desafio geral FGV',q:`Uma sociedade empresária apresentou as seguintes operações financeiras, todas realizadas em dinheiro durante o exercício:\n\n• Recebimento de clientes: R$ 700.000.\n• Pagamento a fornecedores: R$ 250.000.\n• Pagamento de salários: R$ 100.000.\n• Venda de máquinas do imobilizado: R$ 80.000.\n• Aquisição de equipamentos: R$ 180.000.\n• Integralização de capital pelos sócios: R$ 200.000.\n• Pagamento do principal de empréstimos: R$ 90.000.\n• Recebimento de empréstimo bancário: R$ 150.000.\n\nConsiderando exclusivamente essas movimentações, a variação líquida de caixa e equivalentes de caixa no exercício foi de:`,a:['R$ 350.000.','R$ 410.000.','R$ 450.000.','R$ 510.000.','R$ 610.000.'],c:3,r:`<p><b>1. Fluxo operacional:</b></p><div class="calc">700.000 − 250.000 − 100.000 = +R$ 350.000</div><p><b>2. Fluxo de investimento:</b> venda de máquinas menos compra de equipamentos.</p><div class="calc">80.000 − 180.000 = −R$ 100.000</div><p><b>3. Fluxo de financiamento:</b> integralização de capital + empréstimo recebido − amortização do principal.</p><div class="calc">200.000 + 150.000 − 90.000 = +R$ 260.000</div><p><b>4. Variação líquida:</b></p><div class="calc">350.000 − 100.000 + 260.000 = +R$ 510.000</div><p><b>Armadilha FGV:</b> fluxo de investimento negativo não significa necessariamente prejuízo: pode representar expansão da capacidade produtiva.</p>`}
];
let started=false;let index=0;let answers=Array(Q.length).fill(null);let selected=Array(Q.length).fill(null);const el=id=>document.getElementById(id);function render(){if(!started)return;el('quiz').classList.remove('hide');el('end').classList.add('hide');const q=Q[index],ans=answers[index];el('counter').textContent=`QUESTÃO ${index+1} / ${Q.length}`;el('score').textContent=`✅ ${answers.filter((a,i)=>a===Q[i].c).length}  ❌ ${answers.filter((a,i)=>a!==null&&a!==Q[i].c).length}`;el('progress').style.width=`${(index+1)/Q.length*100}%`;el('qtitle').textContent=`${index+1}. ${q.t}`;el('question').textContent=q.q;el('options').innerHTML='';q.a.forEach((a,i)=>{const b=document.createElement('button');b.className='option';b.textContent='ABCDE'[i]+') '+a;if(ans!==null){if(i===q.c)b.classList.add('correct');if(i===ans&&ans!==q.c)b.classList.add('wrong')}else if(selected[index]===i)b.classList.add('selected');b.disabled=ans!==null;b.onclick=()=>{selected[index]=i;render()};el('options').appendChild(b)});el('confirm').disabled=ans!==null||selected[index]===null;el('confirm').classList.toggle('hide',ans!==null);el('feedback').className='feedback '+(ans===null?'hide':ans===q.c?'good':'bad');el('feedback').innerHTML=ans===null?'':`<h3>${ans===q.c?'🟢 PARABÉNS! VOCÊ ACERTOU!':'🔴 RESPOSTA INCORRETA!'}</h3><p><b>Gabarito: letra ${'ABCDE'[q.c]}</b></p><h3>📚 Resolução comentada</h3>${q.r}<p><b>Fundamentação:</b> CPC 03 (R2), especialmente itens 14 a 17; quando pertinente, item 43.</p>`;el('prev').disabled=index===0;el('next').textContent=index===Q.length-1?'RESULTADO 🏆':'SEGUIR ➡';}function finish(){el('quiz').classList.add('hide');el('end').classList.remove('hide');const ac=answers.filter((a,i)=>a===Q[i].c).length,done=answers.filter(a=>a!==null).length;el('end').innerHTML=`<h2>🏆 RESULTADO FINAL</h2><p class="score">${ac} de ${Q.length} acertos</p><p style="font-size:23px">🟢 Acertos: ${ac}<br>🔴 Erros: ${done-ac}<br>📊 Aproveitamento: ${Math.round(ac/Q.length*100)}%</p><p>${done<Q.length?'Você deixou '+(Q.length-done)+' questão(ões) sem responder.':'Parabéns por concluir o desafio!'}</p><button class="confirm" onclick="restart()">↻ REINICIAR QUIZ</button><p class="small">Curso de Contabilidade Professor Moreira • CPC 03 (R2)</p>`}function restart(){if(answers.some(a=>a!==null)&&!confirm('Reiniciar e apagar todas as respostas?'))return;index=0;answers=Array(Q.length).fill(null);selected=Array(Q.length).fill(null);render();scrollTo({top:0,behavior:'smooth'})}el('confirm').onclick=()=>{if(selected[index]===null)return;answers[index]=selected[index];render();el('feedback').scrollIntoView({behavior:'smooth',block:'nearest'})};el('prev').onclick=()=>{if(index>0){index--;render();scrollTo({top:0,behavior:'smooth'})}};el('next').onclick=()=>{if(index===Q.length-1)finish();else{index++;render();scrollTo({top:0,behavior:'smooth'})}};el('restart').onclick=restart;el('startQuiz').onclick=()=>{started=true;el('cover').classList.add('hide');document.querySelector('.head').classList.remove('hide');render();scrollTo({top:0,behavior:'smooth'})};render();
</script></body></html>
